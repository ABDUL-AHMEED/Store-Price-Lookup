        // Function to display items in table
        function displayItems(items) {
            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = ""; 

            if(items.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: #888; padding: 20px;">No items found</td></tr>`;
                return;
            }

            items.forEach(item => {
                let row = `<tr>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.variant}</td>
                    <td class="price">₦${item.price}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        }

        // Search logic function
        function searchItems() {
            const query = document.getElementById("searchBar").value.toLowerCase().trim();
            const filteredItems = inventory.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.variant.toLowerCase().includes(query)
            );
            displayItems(filteredItems);
        }

        // --- FREE VOICE SEARCH INTEGRATION ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                const micBtn = document.getElementById("micBtn");
                micBtn.classList.add("listening");
                document.getElementById("searchBar").placeholder = "Listening... Speak now";
            };

            recognition.onresult = function(event) {
                const spokenText = event.results[0][0].transcript;
                // Remove trailing dots that speech engines sometimes add
                const cleanedText = spokenText.replace(/\.$/, ''); 
                
                document.getElementById("searchBar").value = cleanedText;
                searchItems(); // Automatically search after speaking
            };

            recognition.onerror = function(event) {
                alert("Voice recognition error: " + event.error);
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        }

        function toggleVoiceSearch() {
            if (!recognition) {
                alert("Voice search is not supported by your browser. Please try Chrome or Brave.");
                return;
            }

            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopListening() {
            isListening = false;
            const micBtn = document.getElementById("micBtn");
            if(micBtn) micBtn.classList.remove("listening");
            document.getElementById("searchBar").placeholder = "Type item name to search... (e.g., Milo, Water, Tape)";
        }

        // Initialize table
        displayItems(inventory);
